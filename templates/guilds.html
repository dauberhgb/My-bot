<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر السيرفر | لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); padding: 30px 20px; border-radius: 20px; margin-bottom: 30px; text-align: center; border: 1px solid #4338ca; }
        .verified-badge { background: #065f46; color: #34d399; padding: 6px 16px; border-radius: 50px; display: inline-flex; align-items: center; gap: 8px; font-weight: bold; border: 1px solid #059669; }
        .server-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; transition: 0.3s; }
        .server-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .server-info { display: flex; align-items: center; gap: 15px; }
        .server-icon { width: 50px; height: 50px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #38bdf8; object-fit: cover; }
        .btn-manage { background: #2563eb; color: white; border-radius: 10px; font-weight: bold; text-decoration: none; padding: 8px 20px; }
        .btn-manage:hover { background: #1d4ed8; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="hero-section">
        <h1 class="fw-bold mb-3">سيرفراتك المتاحة</h1>
        <div class="verified-badge">
            <i class="fa-solid fa-circle-check fs-5"></i> البوت موثق على الديسكورد
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            {% for guild in guilds %}
            <div class="server-card">
                <div class="server-info">
                    {% if guild.icon %}
                        <img src="{{ guild.icon }}" class="server-icon" alt="icon">
                    {% else %}
                        <div class="server-icon"><i class="fa-solid fa-server"></i></div>
                    {% endif %}
                    <div>
                        <h5 class="m-0 fw-bold">{{ guild.name }}</h5>
                        <small class="text-muted">ID: {{ guild.id }}</small>
                    </div>
                </div>
                <a href="/dashboard/{{ guild.id }}" class="btn btn-manage"><i class="fa-solid fa-gear ms-1"></i> إعدادات السيرفر</a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

</body>
</html>
