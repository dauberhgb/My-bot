<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر السيرفر | لوحة التحكم</title>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #08090c;
            --bg-glass: rgba(18, 20, 29, 0.55);
            --bg-card: rgba(25, 28, 41, 0.45);
            --bg-card-hover: rgba(35, 39, 58, 0.65);
            
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --accent-glow: rgba(168, 85, 247, 0.45);
            
            --text-white: #ffffff;
            --text-normal: #e2e8f0;
            --text-muted: #94a3b8;
            
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(168, 85, 247, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-normal);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية نيون حية ومتحركة */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            animation: floatOrb 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: #6366f1;
            top: -100px;
            right: -50px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #a855f7;
            bottom: -150px;
            left: -100px;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 80px) scale(1.15); }
            100% { transform: translate(-40px, 40px) scale(0.9); }
        }

        /* Hero Section الزجاجي */
        .hero-section {
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px 20px;
            border-radius: 28px;
            margin-bottom: 35px;
            text-align: center;
            border: 1px solid var(--border-glass);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
        }

        .hero-section h1 {
            font-size: 2.2rem;
            color: var(--text-white);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
        }

        .verified-badge {
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
            padding: 8px 22px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            border: 1px solid rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.15);
            font-size: 0.95rem;
        }

        /* Server Cards الزجاجية التفاعلية */
        .server-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 22px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .server-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 25px var(--accent-glow);
        }

        .server-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .server-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px var(--accent-glow);
            transition: transform 0.3s ease;
        }

        .server-card:hover .server-icon {
            transform: scale(1.08) rotate(3deg);
            border-color: rgba(168, 85, 247, 0.6);
        }

        .server-info h5 {
            color: var(--text-white);
            font-size: 1.15rem;
            letter-spacing: 0.3px;
        }

        .server-info small {
            color: var(--text-muted) !important;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* زر إدارة السيرفر المضاء (Glow Button) */
        .btn-manage {
            background: var(--accent-gradient) !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 14px !important;
            font-weight: 800 !important;
            text-decoration: none;
            padding: 12px 26px !important;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            box-shadow: 0 6px 20px var(--accent-glow);
            position: relative;
            overflow: hidden;
        }

        .btn-manage::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: rotate(45deg);
            transition: all 0.5s ease;
        }

        .btn-manage:hover::before {
            left: 100%;
        }

        .btn-manage:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.6);
            color: #ffffff !important;
        }

        @media (max-width: 576px) {
            .server-card {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
            .server-info {
                flex-direction: column;
            }
            .btn-manage {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- عناصر الإضاءة الخلفية الحية -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

<div class="container py-5">
    <div class="hero-section">
        <h1 class="fw-bold mb-3">سيرفراتك المتاحة</h1>
        <div class="verified-badge">
            <i class="fa-solid fa-circle-check fs-5"></i> البوت موثق على الديسكورد
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-8">
            {% for guild in guilds %}
            <div class="server-card">
                <div class="server-info">
                    {% if guild.icon %}
                        <img src="{{ guild.icon }}" class="server-icon" alt="icon">
                    {% else %}
                        <div class="server-icon"><i class="fa-solid fa-server"></i></div>
                    {% endif %}
                    <div>
                        <h5 class="m-0 fw-bold">{{ guild.name }}</h5>
                        <small class="text-muted">ID: {{ guild.id }}</small>
                    </div>
                </div>
                <a href="/dashboard/{{ guild.id }}" class="btn btn-manage"><i class="fa-solid fa-gear ms-1"></i> إعدادات السيرفر</a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

</body>
</html>
